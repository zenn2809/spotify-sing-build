name: Build patched spotifyglass dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install make
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Fetch source matching Spotify 9.1.78 Sing
        run: |
          git clone https://github.com/skopevoj/spoti.pw.git upstream
          git -C upstream checkout 02762ed1a08136c32fe9dba6c6492cf31e42b839
          cp tweak/Sources/Shared/Sing/SGSingModel.m upstream/tweak/Sources/Shared/Sing/SGSingModel.m
          grep -F 'https://huggingface.co/ralphguu/spotify-sing-model/resolve/main/' upstream/tweak/Sources/Shared/Sing/SGSingModel.m
          cp compat/SGGlass.m upstream/tweak/Sources/Core/SGGlass.m
          cp compat/EdgeEffect.x upstream/tweak/Sources/Native/Appearance/EdgeEffect.x
          cp compat/EdgeEffect.x upstream/tweak/Sources/Redesigned/Kit/SGREdgeEffect.x
          python3 - <<'PY'
          from pathlib import Path
          path = Path('upstream/tweak/Sources/Redesigned/Lyrics/SGRSingControl.m')
          text = path.read_text()
          start = text.index('        if (@available(iOS 26.0, *)) {', text.index('UIVisualEffectView *pane'))
          end = text.index('        content = pane.contentView;', start)
          path.write_text(text[:start] + text[end:])
          PY
          # Xcode 26 is not installed on the runner.  The iOS 26-only glass
          # button selector is unrelated to Sing, so use the supported
          # fallback configuration while compiling this target.
          # The iOS 26 glass-button selectors appear in two visual-only
          # settings screens.  Use the supported fallback on this runner;
          # Sing's model and playback pipeline are unaffected.
          sed -i '' 's/\[UIButtonConfiguration prominentGlassButtonConfiguration\]/[UIButtonConfiguration filledButtonConfiguration]/' upstream/tweak/Sources/App/Onboarding/Tour.m
          sed -i '' 's/\[UIButtonConfiguration glassButtonConfiguration\]/[UIButtonConfiguration filledButtonConfiguration]/' upstream/tweak/Sources/Redesigned/Lyrics/SGRKaraokeView.m
          # This copies an iOS 26 visual-only corner setting.  Remove that
          # message send when compiling against the runner's older SDK; the
          # transition still uses the pane's regular CALayer corner radius.
          sed -i '' '/setCornerConfiguration:.*cornerConfiguration/d' upstream/tweak/Sources/Redesigned/NowPlayingBar/BarTransition.x
          # The runner lacks UIGlassEffect. Use the existing supported glass
          # fallback for search-card decoration instead of the iOS 26 tint.
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('upstream/tweak/Sources/Redesigned/Search/SearchCards.x')
          text = path.read_text()
          pattern = r'    if \(@available\(iOS 26\.0, \*\)\) \{\n        if \(parts\.glass\) \{\n            UIGlassEffect \*effect = \[UIGlassEffect effectWithStyle:UIGlassEffectStyleClear\];\n            effect\.tintColor = \[color colorWithAlphaComponent:kTintAlpha\];\n            parts\.glass\.effect = effect;\n        \}\n    \}\n'
          text, count = re.subn(pattern, '    if (parts.glass) parts.glass.effect = SGGlassEffect();\\n', text, count=1)
          if count != 1:
              raise SystemExit('expected SearchCards visual block was not found')
          path.write_text(text)
          PY
          sed -i '' '/static const CGFloat kTintAlpha = 0.35;/d' upstream/tweak/Sources/Redesigned/Search/SearchCards.x

      - name: Compile patched dylib
        run: |
          gmake -C upstream/tweak package FINALPACKAGE=1
          cp upstream/tweak/.theos/obj/arm64/spotifyglass.dylib spotifyglass.dylib
          file spotifyglass.dylib

      - name: Upload patched dylib
        uses: actions/upload-artifact@v4
        with:
          name: spotifyglass-patched-dylib
          path: spotifyglass.dylib
          if-no-files-found: error
          retention-days: 7
